# CI: on every push and pull request, on Linux, macOS and Windows —
#   1. the full test suite;
#   2. the installer of that system (install.sh / install.ps1) into a throwaway home, cloning this checkout;
#   3. a scripted first run with the installed `artel` and the dashboard answering /api/ready (scripts/ci_smoke.py).
# Nothing touches the runner's real home: HOME / USERPROFILE point into the job's temp directory.
# Engineering gates (docs/SPEC.md §11) run in three further Linux jobs: `static` (archcheck, ruff, mypy, pip-audit),
# `coverage` (branch coverage vs a ratcheted threshold) and `changed-code` (CRAP, duplicates, mutation on changed code).
# Every action is pinned by full commit SHA; the comment names the version.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"           # UTF-8 everywhere, including Windows runners (Cyrillic and ▲ in output and files)
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NO_COLOR: "1"

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and test dependencies
        shell: bash
        run: |
          mkdir -p ci-logs
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        shell: bash
        run: python -m pytest -q -p no:cacheprovider -rfE --durations=15 2>&1 | tee ci-logs/pytest.log

      # ---------------------------------------------------------------- Linux / macOS
      - name: Installer (install.sh) into a temporary home
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home
          ARTEL_REPO: ${{ github.workspace }}
        run: |
          mkdir -p "$HOME"
          bash install.sh --no-start --yes 2>&1 | tee ci-logs/install.log
          test -x "$HOME/.local/bin/artel"
          installed="$(git -C "$HOME/.artel/app" rev-parse HEAD)"; tested="$(git rev-parse HEAD)"
          echo "installed $installed, checked out $tested"
          test "$installed" = "$tested"

      - name: Scripted first run and dashboard (installed artel)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/home
        run: python scripts/ci_smoke.py --artel "$HOME/.local/bin/artel" --port 8799 --logs ci-logs/smoke

      # ---------------------------------------------------------------- Windows
      - name: Installer (install.ps1) into a temporary home
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}\home
          ARTEL_REPO: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoStart | Tee-Object -FilePath ci-logs/install.log
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with exit code $LASTEXITCODE" }
          $artel = Join-Path $env:USERPROFILE ".artel\venv\Scripts\artel.exe"
          if (-not (Test-Path $artel)) { throw "$artel is missing" }
          $installed = git -C (Join-Path $env:USERPROFILE ".artel\app") rev-parse HEAD
          $tested = git rev-parse HEAD
          Write-Host "installed $installed, checked out $tested"
          if ($installed -ne $tested) { throw "the installer did not install the checked-out commit" }

      - name: Scripted first run and dashboard (installed artel)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}\home
        run: |
          python scripts/ci_smoke.py --artel (Join-Path $env:USERPROFILE ".artel\venv\Scripts\artel.exe") --port 8799 --logs ci-logs/smoke
          if ($LASTEXITCODE -ne 0) { throw "smoke check failed" }

      # ---------------------------------------------------------------- logs
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-${{ matrix.os }}-py${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ci-logs/
            ${{ runner.temp }}/home/.artel/projects/*/events.jsonl
            ${{ runner.temp }}/home/.artel/projects/*/project.json

  # ------------------------------------------------------------------ engineering gates
  static:
    name: gates · static (archcheck, ruff, mypy, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the gate tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gates]"
      - name: archcheck (import cycles, module state, vendor names, core purity)
        run: python scripts/archcheck.py
      - name: ruff (ratchet on scripts/ruff_baseline.json)
        run: python scripts/lint_ratchet.py ruff
      - name: mypy (strict for contracts and ports, ratchet on scripts/mypy_baseline.json for the rest)
        run: python scripts/lint_ratchet.py mypy
      - name: pip-audit (declared dependencies, known vulnerabilities fail the job)
        run: python -m pip_audit --strict --progress-spinner off .

  coverage:
    name: gates · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the gate tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gates]"
      - name: Tests under coverage (line + branch)
        run: |
          python -m coverage run -m pytest -q -p no:cacheprovider
          python -m coverage json -o coverage.json
          python -m coverage report --skip-covered | tail -n 15
      - name: Threshold (stored in scripts/coverage_threshold.txt) and ratchet
        run: |
          python scripts/coverage_gate.py check coverage.json
          python scripts/coverage_gate.py monotonic --base origin/master
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-json
          path: coverage.json

  changed-code:
    name: gates · changed code (CRAP, duplicates, mutation)
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-json
      - name: Install the package and the gate tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,gates]"
      - name: Changed lines
        run: python scripts/changed_gates.py lines
      - name: CRAP < 10 per changed function
        run: python scripts/changed_gates.py crap --coverage coverage.json
      - name: Duplicate code in changed files
        run: python scripts/changed_gates.py dup
      - name: Mutation run on changed files (10 minute budget)
        run: python scripts/changed_gates.py mutation --budget-min 10
