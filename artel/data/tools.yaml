# Names that differ between ecosystems. Default: the tool's own name everywhere. `alias`: the binary name a system
# package installs when it is not the tool's name (Debian's fd-find installs `fdfind`). fd has no published checksum
# file, so it is not in `tools:` (never a guessed hash); it still comes through conda-forge or the system manager.
packages:
  rg: {apt: ripgrep, brew: ripgrep, winget: BurntSushi.ripgrep.MSVC, conda: ripgrep}
  fd: {apt: fd-find, brew: fd, winget: sharkdp.fd, conda: fd-find, alias: fdfind}
  jq: {apt: jq, brew: jq, winget: jqlang.jq, conda: jq}
  gh: {apt: gh, brew: gh, winget: GitHub.cli, conda: gh}
  uv: {brew: uv, winget: astral-sh.uv, conda: uv}
  git: {apt: git, brew: git, winget: Git.Git, conda: git}
  curl: {apt: curl, brew: curl, conda: curl}
  make: {apt: make, brew: make, conda: make}
  node: {apt: nodejs, brew: node, winget: OpenJS.NodeJS.LTS, conda: nodejs}
  npm: {apt: npm, brew: node, conda: nodejs}
  pandoc: {apt: pandoc, brew: pandoc, winget: JohnMacFarlane.Pandoc, conda: pandoc}
  ffmpeg: {apt: ffmpeg, brew: ffmpeg, winget: Gyan.FFmpeg, conda: ffmpeg}
  pdftotext: {apt: poppler-utils, brew: poppler, conda: poppler}
  convert: {apt: imagemagick, brew: imagemagick, conda: imagemagick}
  sqlite3: {apt: sqlite3, brew: sqlite, conda: sqlite}
  shellcheck: {apt: shellcheck, brew: shellcheck, winget: koalaman.shellcheck, conda: shellcheck}
