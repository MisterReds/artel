<style>
:root{
  /* Artel brand: copper on warm paper. Status colours are distinct from the brand so a running task never
     looks like a button. Fonts: Unbounded (display), Onest (text), JetBrains Mono (logs, code). */
  --brand:#B5522B;--brand-ink:#fff;--brand-soft:#F3E3D9;
  --bg:#F7F4EE;--panel:#FFFDF9;--ink:#1E1A16;--muted:#6E665C;--line:#E6DFD3;--chip:#EFE9DF;
  --accent:var(--brand);--accent-ink:var(--brand-ink);
  --ok:#2E8549;--warn:#B07F12;--bad:#C0392B;--run:#1F7A72;--rev:#7A55C9;--todo:#A39E96;
  --display:"Unbounded",system-ui,sans-serif;--text:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#E07B4E;--brand-ink:#1A0E08;--brand-soft:#3A2418;
  --bg:#15120F;--panel:#1E1A16;--ink:#EFE8DD;--muted:#A39A8D;--line:#332C25;--chip:#2A241E;
  --ok:#5CCB7C;--warn:#E0B34A;--bad:#F07A6A;--run:#4FC1B5;--rev:#B69BF0;--todo:#5E574F;}}
:root[data-theme="dark"]{--brand:#E07B4E;--brand-ink:#1A0E08;--brand-soft:#3A2418;
  --bg:#15120F;--panel:#1E1A16;--ink:#EFE8DD;--muted:#A39A8D;--line:#332C25;--chip:#2A241E;
  --ok:#5CCB7C;--warn:#E0B34A;--bad:#F07A6A;--run:#4FC1B5;--rev:#B69BF0;--todo:#5E574F;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--text);font-feature-settings:"tnum" 0}
a{color:var(--accent);text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea,input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;flex-wrap:wrap}
header .logo{display:flex;align-items:center;gap:9px;font:700 18px/1 var(--display);letter-spacing:.01em;color:var(--ink)}header .logo svg{width:26px;height:26px;color:var(--ink)}header{box-shadow:inset 0 -2px 0 var(--brand)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:8px;color:var(--muted)}
nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}nav a:hover{color:var(--ink)}
.wrap{padding:16px 20px;max-width:1500px;margin:0 auto}
.layout{display:grid;grid-template-columns:1fr 360px;gap:0;height:calc(100vh - 53px)}
.layout main{overflow:auto;padding:16px 20px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.stat{color:var(--muted);font-size:13px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);border:1px solid var(--line);white-space:nowrap}
.badge.execution{color:var(--run);border-color:var(--run)}.badge.review{color:var(--rev);border-color:var(--rev)}
.badge.done{color:var(--ok);border-color:var(--ok)}.badge.waiting_human,.badge.error,.badge.paused_budget{color:var(--bad);border-color:var(--bad)}
.badge.audit,.badge.planning{color:var(--warn);border-color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:600 22px/1.2 var(--display)}.kpi span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.pcard:hover{border-color:var(--accent)}
.pcard .top{display:flex;gap:8px;align-items:flex-start}.pcard .nm{font-weight:600;flex:1;overflow-wrap:anywhere}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--chip)}
.bar i{display:block;height:100%}
.s-done{background:var(--ok)}.s-review{background:var(--rev)}.s-running{background:var(--run)}.s-ready{background:var(--warn)}.s-todo{background:var(--todo)}.s-blocked{background:var(--bad)}
.avatars{display:flex;gap:4px;flex-wrap:wrap}
.av{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip)}.av.busy{background:color-mix(in srgb,var(--run) 18%,var(--chip));color:var(--run)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted);flex:none;margin-top:6px}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:3px 10px;font-size:12.5px;border-radius:99px}.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.alert{border-left:3px solid var(--bad);background:var(--panel);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.stepper{display:flex;gap:0;margin:8px 0 4px;flex-wrap:wrap}
.step{flex:1;min-width:90px;text-align:center;font-size:12px;padding:6px 4px;border-bottom:3px solid var(--line);color:var(--muted)}
.step.past{border-color:var(--ok);color:var(--ink)}.step.now{border-color:var(--accent);color:var(--accent);font-weight:600}
.team{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.worker{min-width:210px;max-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.worker b{display:block}.worker .role{color:var(--muted);font-size:12px}
.worker .now{font-size:12px;margin-top:6px;color:var(--run)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:start}
.col{background:color-mix(in srgb,var(--chip) 60%,transparent);border-radius:12px;padding:8px;min-height:110px}
.col h3{font-size:12px;margin:2px 4px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.card.running{border-left-color:var(--run)}.card.review{border-left-color:var(--rev)}.card.done{border-left-color:var(--ok)}
.card.blocked{border-left-color:var(--bad)}.card.ready{border-left-color:var(--warn)}
.card .t{font-weight:550;overflow-wrap:anywhere}.card .m{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.human{color:var(--bad);font-weight:600}
.goal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 4px}
.feed{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.feedhead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
#events{overflow:auto;flex:1;padding:6px 10px;font-size:12.5px}
.ev{padding:5px 4px;border-bottom:1px dashed var(--line);word-break:break-word}
.ev .k{font-family:var(--mono);font-size:11px;color:var(--muted)}.ev .a{font-weight:600}
.ev.err{color:var(--bad)}.ev.good{color:var(--ok)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;background:color-mix(in srgb,var(--chip) 50%,var(--panel))}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.ft{display:inline-block;font-size:11px;padding:0 6px;border-radius:99px;background:var(--chip);margin:1px}
.dlg h3,.wrap>h3{font:600 16px/1.3 var(--display)}h4{font-weight:600;margin:14px 0 6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);width:min(860px,94vw);max-height:88vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:18px 20px;overflow:auto;max-height:84vh}
pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:8px;overflow:auto;max-height:340px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.files a{display:block;cursor:pointer;padding:2px 0}
.empty{color:var(--muted);padding:40px;text-align:center}
.tl{display:flex;flex-direction:column;gap:2px;font-size:12.5px}.tl div{display:flex;gap:10px}.tl .ts{color:var(--muted);font-family:var(--mono);min-width:72px}
.feedbtn{display:none}
@media (max-width:1100px){.layout{grid-template-columns:1fr}.feed{display:none}.feed.show{display:flex;position:fixed;inset:0;z-index:5}.feedbtn{display:inline-block}}
@media (max-width:720px){.wrap,.layout main{padding:12px 16px}header{padding:10px 16px;gap:8px}header .logo{flex:1}nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto}nav a{white-space:nowrap}.board{grid-template-columns:1fr}.col{min-height:0}.grid{grid-template-columns:1fr}}
button:disabled{opacity:.45;cursor:default}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pvc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pvc h3{margin:0;font:600 15px/1.3 var(--display);display:flex;align-items:center;gap:8px}
.pvc .st{white-space:nowrap;font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);margin-left:auto;font-family:var(--text);font-weight:500}
.pvc .st.on{color:var(--ok);border-color:var(--ok)}.pvc .st.off{color:var(--muted)}
.devcode{font:600 28px/1.2 var(--mono);letter-spacing:.12em;color:var(--brand);background:var(--brand-soft);border-radius:10px;
  padding:10px 14px;text-align:center;user-select:all}
.pvroles{max-width:760px}.pvroles select{width:auto;min-width:300px}
@media (max-width:720px){.pvroles select{min-width:0;width:100%;max-width:100%}.pvroles td:first-child{white-space:nowrap}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--muted)}
.ri{display:inline-flex;width:15px;height:15px;vertical-align:-2px;margin-right:4px;color:var(--muted)}.ri svg{width:100%;height:100%}
.worker .role{display:flex;align-items:center;gap:2px}.worker .ri{color:var(--brand)}
.plg .pvc .st.err{color:var(--bad);border-color:var(--bad)}.plg .perm{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);margin:1px}
.plg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.plg .errbox{color:var(--bad);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.plg .inst{display:flex;gap:8px;max-width:760px}.plg .inst input{flex:1}
.empty .mark{width:56px;height:56px;color:var(--line);margin:0 auto 12px;display:block}
.netwarn{display:none;border-left:3px solid var(--warn);background:var(--panel);padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.netwarn.show{display:block}
#logout{display:none}
/* two audiences: a person who runs projects sees what they need; the developer mode (Настройки) shows the rest */
body:not(.devmode) .dev{display:none!important}
.devtag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--brand-soft);color:var(--brand);margin-left:6px;vertical-align:1px}
.set{max-width:760px}.set section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.set h3{margin:0 0 6px;font:600 15px/1.3 var(--display)}.set .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.set .row input:not([type=radio]):not([type=checkbox]){flex:1;min-width:200px}.set .row .switch{align-items:center}.switch{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.switch input{width:auto;margin-top:3px}
@supports(padding:env(safe-area-inset-top)){header{padding-top:max(10px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/portfolio"><svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><line x1="32" y1="9" x2="11" y2="55"/><line x1="32" y1="9" x2="53" y2="55"/><line x1="20.5" y1="36" x2="43.5" y2="36"/></g><g fill="var(--brand)"><circle cx="32" cy="9" r="6.2"/><circle cx="11" cy="55" r="6.2"/><circle cx="53" cy="55" r="6.2"/><circle cx="20.5" cy="36" r="5"/><circle cx="43.5" cy="36" r="5"/></g></svg>Artel</a>
  <nav id="nav">
    <a href="#/portfolio" data-v="portfolio">Проекты</a>

<div class="netwarn" id="netwarn" role="alert"><b>Соединение без HTTPS.</b> Токен и сессия идут по сети открытым текстом —
  подключите HTTPS (Caddy или Tailscale, см. docs/REMOTE.md).</div>
<div id="view"></div>
<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>
<script>
// --- brand: role icons (16px line icons, currentColor) ----------------------------------------------
const RI={
 manager:'<path d="M4 21V4m0 0h11l-2 4 2 4H4"/>',
 planner:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
 worker:'<path d="M14 6l4 4M3 21l9-9M12 4l8 8-3 3-8-8z"/>',
 tester:'<path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3M7 15h10"/>',
 reviewer:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
 auditor:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
 librarian:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 7h7"/>',
 refiner:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 evolver:'<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-11 7"/>',
 absorber:'<path d="M6 3v8a6 6 0 0 0 12 0V3M6 7h4M14 7h4"/>',
 human:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'};
function roleKey(r){r=(r||'').toLowerCase();for(const [k,re] of [['reviewer',/review|ревью/],['tester',/test|тест|qa/],['auditor',/audit|аудит/],
  ['manager',/manag|менедж/],['planner',/plan|план/],['librarian',/librar|библиот/],['refiner',/refin/],['evolver',/evol/],
  ['absorber',/absorb/],['human',/human|user|человек/]])if(re.test(r))return k;return 'worker'}
function ri(role){return `<span class="ri" title="${esc(role||'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${RI[roleKey(role)]}</svg></span>`}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// remote mode: a lost session (expired, token rotated) sends the app back to the login page
const authed=r=>{if(r.status===401){location.replace('/login');throw new Error('login required')}return r};
const api=(p,o)=>fetch(p,o).then(authed).then(r=>r.json());
fetch('/api/auth/status').then(r=>r.json()).then(s=>{
  if(s.insecure&&location.protocol!=='https:'&&!/^(localhost|127\.|\[::1\])/.test(location.hostname))$('#netwarn').classList.add('show');
  if(s.remote){$('#logout').style.display='inline-block';$('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'}});location.replace('/login')}}
}).catch(()=>{});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const COLS=[['todo','Ожидают'],['ready','Готовы'],['running','В работе'],['review','Ревью'],['done','Готово'],['blocked','Блок']];
const STAGE={planning:'планирование',execution:'исполнение',review:'ревью',audit:'аудит цели',done:'цель достигнута',waiting_human:'ждёт человека',stopped:'остановлен',paused_budget:'бюджет исчерпан',needs_review:'нужна проверка',error:'ошибка',running:'в работе'};
const STEPS=['planning','execution','review','audit','done'];
const ago=ts=>{const s=Math.max(0,Date.now()/1000-ts);return s<60?`${s|0} с назад`:s<3600?`${s/60|0} мин назад`:s<86400?`${s/3600|0} ч назад`:`${s/86400|0} дн назад`};
const money=v=>v==null?'—':'$'+(v<1?v.toFixed(3):v.toFixed(2));
let TZ='';
const fmtTime=(ts,withDate)=>{const o=withDate?{dateStyle:'short',timeStyle:'medium'}:{timeStyle:'medium'};
  try{return new Intl.DateTimeFormat(undefined,TZ?{...o,timeZone:TZ}:o).format(new Date(ts*1000))}
  catch(e){return new Intl.DateTimeFormat(undefined,o).format(new Date(ts*1000))}};
const fmtT=ts=>fmtTime(ts,false), fmtDT=ts=>fmtTime(ts,true);
fetch('/api/providers').then(r=>r.json()).then(j=>{TZ=(j.timezone||{}).configured||''}).catch(()=>{});
const num=v=>v==null?'—':Number(v).toLocaleString();
const pct=v=>v==null?'—':Math.round(v*100)+'%';
let timer=null, es=null, state={};
try{const t=localStorage.getItem('artel-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
// Режим разработчика: эволюция, реестр харнессов, плагины, статистика воркеров, сырые события, токены и роли
let DEV=false;try{DEV=localStorage.getItem('artel-dev')==='1'}catch(e){}
document.body.classList.toggle('devmode',DEV);
function setDev(on){DEV=on;document.body.classList.toggle('devmode',on);try{localStorage.setItem('artel-dev',on?'1':'0')}catch(e){}}
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('artel-theme',r.dataset.theme)}catch(e){}};
const dlgEl=$('#dlg');dlgEl.addEventListener('click',e=>{if(e.target===dlgEl)dlgEl.close()});
/* Диагност: «Почему?» — объяснение сбоя на доступной модели */
async function why(problem,slug,task){dlg('<h3>Диагност</h3><p class="stat">Собираю факты и разбираю причину на доступной модели… обычно до минуты.</p>');
  const j=await post('/api/doctor',{problem,slug:slug||'',task_id:task||''});if(!j||!j.id){$('#dlgbody').querySelector('p').textContent='Не удалось запустить диагноста.';return}
  const WHO={artel:'Artel',owner:'владелец — на этой машине или в аккаунте',provider:'провайдер модели',unknown:'неизвестно'};
  for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,2000));const s=await api('/api/doctor/'+j.id);if(s.phase!=='done')continue;const r=s.report;
    dlg(`<h3>Диагност</h3><p><b>Причина:</b> ${esc(r.cause||'')}</p><p><b>Исправляет:</b> ${esc(WHO[r.who]||r.who||'')}</p>
      ${(r.steps||[]).length?`<h2>Что сделать</h2><ol>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
      ${r.evidence?`<h2>Доказательство</h2><pre>${esc(r.evidence)}</pre>`:''}
      <p class="stat">${r.by==='rules'?'Ответ по встроенным правилам'+(r.model_error?' (модель недоступна: '+esc(r.model_error)+')':''):'Разобрано моделью: '+esc(r.by)}</p>`);return}
  $('#dlgbody').querySelector('p').textContent='Диагност не успел ответить; повторите позже.'}
function dlg(html){$('#dlgbody').innerHTML=html+'<div style="text-align:right;margin-top:12px"><button onclick="dlgEl.close()">Закрыть</button></div>';dlgEl.showModal()}
$('#newbtn').onclick=()=>{dlg(`<h3>Новый проект</h3><p class="stat">Опишите, что нужно получить. Artel наберёт команду воркеров, разложит цель на задачи, выполнит и проверит их. Ход работы виден на странице проекта.</p>

async function portfolio(){

  $('#view').innerHTML='<div class="wrap" id="pf"><div class="empty">Загрузка…</div></div>';state.pfilter=state.pfilter||'all';state.pq=state.pq||'';
  await draw();timer=setInterval(draw,3000)}
function readyBanner(){const r=state.ready;if(!r||r.runtime!=='none')return '';
  return `<div class="alert" onclick="location.hash='#/providers'"><b>Нет подключённого исполнителя.</b> Проекты не начнутся, пока не подключён Claude Code или Codex (или ключ API). Открыть «Подключения» →</div>`}
function renderPortfolio(){const ps=state.ps;const att=ps.flatMap(p=>(p.attention||[]).map(a=>({...a,p})));
  const live=ps.filter(p=>p.live).length,done=ps.reduce((s,p)=>s+(p.tasks_done||0),0),tot=ps.reduce((s,p)=>s+(p.tasks_total||0),0);

  $('#pf').innerHTML=`${readyBanner()}<div class="kpis">

  ${shown.length?`<div class="grid">${shown.map(pcard).join('')}</div>`:`<div class="empty"><svg class="mark" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><line x1="32" y1="9" x2="11" y2="55"/><line x1="32" y1="9" x2="53" y2="55"/><line x1="20.5" y1="36" x2="43.5" y2="36"/></g></svg><div style="max-width:420px;margin:0 auto;text-align:left"><b>Как начать</b><ol style="margin:8px 0 0;padding-left:20px">
    <li>«Подключения» — войдите в Claude Code или Codex (подписка) либо задайте ключ API.</li>
    <li>«+ Новый проект» — опишите, что нужно получить.</li>
    <li>Следите за доской проекта; если воркеру нужен человек, проект попросит.</li></ol></div></div>`}`;

  const q=$('#pq');q.oninput=()=>{state.pq=q.value.toLowerCase();renderPortfolio();const n=$('#pq');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}

function pcard(p){const c=p.counts||{};return `<div class="pcard" data-s="${esc(p.slug)}">

async function project(slug){state.slug=slug;state.events=[];
  $('#view').innerHTML=`<div class="layout"><main id="pm"><div class="empty">Загрузка…</div></main>
    <section class="feed" id="feed"><div class="feedhead"><input id="filter" placeholder="Поиск по ленте: имя, задача, слово…"><button class="feedbtn" id="closefeed">×</button></div><div id="events"></div></section></div>`;
  $('#filter').oninput=()=>{$('#events').innerHTML='';state.events.forEach(appendEvent)};$('#closefeed').onclick=()=>$('#feed').classList.remove('show');
  await refresh();
  es=new EventSource(`/api/projects/${encodeURIComponent(slug)}/events?after=0`);
  es.onmessage=m=>{const e=JSON.parse(m.data);state.events.push(e);if(state.events.length>5000)state.events.shift();appendEvent(e);
    if(/^(board|run|project|worker|review|audit|manager|agent\/(start|end)|llm\/error|provider|tool\/call)/.test(e.kind))schedule()}}
let pending=null;function schedule(){if(!pending)pending=setTimeout(()=>{pending=null;refresh()},400)}

  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px"><div style="font-size:20px;font-weight:600;flex:1;min-width:200px">${esc(m.name)}</div>

    ${v.live?'<button id="stop">Стоп</button>':m.status==='done'?'':'<button id="resume">Продолжить</button>'}<button class="feedbtn" id="openfeed">Лента</button></div>
  <div class="stepper">${STEPS.map((s,i)=>`<div class="step ${si<0?'':i<si?'past':i===si?'now':''}">${STAGE[s]}</div>`).join('')}</div>
  <div class="stat">задач выполнено ${st.tasks_done} из ${st.tasks_total}<span class="dev"> · токены ${num(u.input_tokens)} → ${num(u.output_tokens)} · запросов ${u.requests} · ${money(st.cost_usd)} · раундов аудита ${m.audit_rounds||0}</span></div>

  ${st.attention.length?`<h2>Требует внимания</h2>${st.attention.map(a=>`<div class="alert" data-t="${a.task_id}"><b>${esc(a.title)}</b> <span class="stat">· @${esc(a.assignee)} · ${esc(a.reason)} — откройте и напишите исполнителю</span></div>`).join('')}`:''}
  ${activeBox(v,tasks)}
  <h2>Команда</h2><div class="team">${v.workers.map(w=>{const s=st.workers.find(x=>x.name===w.name)||{};return `<div class="worker" data-w="${esc(w.name)}"><b>${esc(w.name)}</b><span class="role">${ri(w.role)}${esc(w.role)}</span>

  <h2>Результат</h2><div id="resbox-ph"></div>

  if(k==='run/started')return ['▶ запуск #'+e.run_id,`${e.worker} → ${e.task_id}`];
  if(k==='run/finished')return ['■ запуск #'+e.run_id,`${e.status} · ${e.summary||''}`];

async function registry(){$('#view').innerHTML='<div class="wrap" id="rg"><div class="empty">Загрузка реестра…</div></div>';
  state.reg=state.reg||await api('/api/registry');state.rc=state.rc||'harness';state.rq='';state.rf='';state.rn=100;renderRegistry()}
function renderRegistry(){const all=state.reg;const cats=Object.entries(all.reduce((m,e)=>(m[e.category]=(m[e.category]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]);

   <div class="chips">${[['all',all.length],...cats].map(([c,n])=>`<button data-c="${c}" class="${state.rc===c?'on':''}">${c==='all'?'все':esc(CAT[c]||c)} ${n}</button>`).join('')}</div>

     <td>${esc(CAT[e.category]||e.category)}</td><td class="n">${e.sources.length}</td><td class="stat">${esc((e.last_commit||'').slice(0,10))}</td>

   ${rows.length>state.rn?`<div style="text-align:center;margin:12px"><button id="more">Показать ещё (${rows.length-state.rn})</button></div>`:''}`;

const DM={pass_rate:['прохождение',1,v=>(v>0?'+':'')+Math.round(v*100)+' п.п.'],partial_mean:['частично',1,v=>(v>0?'+':'')+v.toFixed(3)],

  rejections:['отказы',-1,v=>(v>0?'+':'')+v],stalls:['срывы',-1,v=>(v>0?'+':'')+v]};
function deltaChips(d){return Object.entries(DM).filter(([k])=>d&&d[k]!=null&&d[k]!==0).map(([k,[l,dir,f]])=>{const good=d[k]*dir>0;
  return `<span class="ft" style="color:${good?'var(--ok)':'var(--bad)'}">${l} ${f(d[k])}</span>`}).join('')||'<span class="stat">без изменений метрик</span>'}

  $('#evo').innerHTML=evs.map(ev=>{const L=ev.ledger,base=L.filter(e=>e.kind==='baseline'),cands=L.filter(e=>e.kind==='candidate'||e.kind==='absorb_candidate');
    const gens=[...new Set(cands.map(c=>c.generation))].sort((a,b)=>b-a);const run=ev.state.running;
    return `<p class="stat">Artel улучшает сам себя: каждая гипотеза — ветка git, реализует её сам Artel, затем тесты и бенчмарк со скрытыми проверками; лучший кандидат вливается в <b>${esc(ev.state.main)}</b>.</p>
    <div class="kpis"><div class="kpi"><b>${ev.state.generation||0}</b><span>поколений</span></div><div class="kpi"><b>${cands.length}</b><span>кандидатов</span></div>
      <div class="kpi"><b style="color:var(--ok)">${cands.filter(c=>c.merged).length}</b><span>влито</span></div><div class="kpi"><b>${esc(ev.state.champion||'—')}</b><span>чемпион</span></div>
      <div class="kpi"><b>${ev.branches.length}</b><span>веток evolve/*</span></div></div>
    ${run?`<div class="alert" style="border-left-color:var(--run)">▶ идёт поколение ${run.generation}: ${esc(run.phase)} · ${ago(run.since).replace(' назад','')}
      <div class="stat">${run.auto_resume_blocked?'⚠ автоперезапуск остановлен: '+esc(run.auto_resume_blocked)+' — после исправления: <code>artel evolve --resume</code>'
        :(ev.state.process||{}).alive?'процесс работает (pid '+esc(String(ev.state.process.pid))+')'+((run.supervisor||{}).restarts?` · перезапусков после сбоев: ${run.supervisor.restarts}`:'')
        :'процесс остановлен — дашборд продолжит поколение автоматически в течение пары минут'}</div></div>`:''}
    <h2>Чемпион по коммитам</h2><div class="tablewrap"><table><tr><th>коммит</th><th class="n">прохождение</th><th class="n">частично</th><th class="n">стоимость</th><th class="n">время/задача</th><th class="n">отказы</th><th class="n">срывы</th></tr>
      ${base.map(b=>`<tr><td>${esc(b.commit.slice(0,10))}</td><td class="n">${pct(b.summary.pass_rate)}</td><td class="n">${b.summary.partial_mean.toFixed(2)}</td><td class="n">${money(b.summary.cost_usd)}</td><td class="n">${b.summary.duration_mean_s} с</td><td class="n">${b.summary.rejections}</td><td class="n">${b.summary.stalls}</td></tr>`).join('')||'<tr><td colspan="7" class="stat">базовый замер идёт…</td></tr>'}</table></div>
    ${gens.map(g=>`<h2>Поколение ${g}</h2>${cands.filter(c=>c.generation===g).map(c=>`<div class="pcard" style="cursor:default">
      <div class="top"><span class="nm">${esc(c.hypothesis.title)}</span><span class="badge ${c.merged?'done':'error'}">${c.merged?'влито':'отклонено'}</span></div>
      <div class="stat">${esc(c.branch)}${c.commit&&c.commit.diffstat?' · '+esc(c.commit.diffstat):''}${c.tests?' · тесты: '+esc(c.tests.summary):''}${c.implementation&&c.implementation.cost_usd?' · реализация '+money(c.implementation.cost_usd):''} · источник: ${esc(c.hypothesis.source)}</div>
      <div><b>Решение:</b> ${esc(c.reason||'')}</div><div>${deltaChips(c.delta)}</div>
      ${c.per_task?`<div class="tablewrap"><table><tr><th>задача</th><th>было → стало</th><th class="n">частично</th><th class="n">стоимость</th><th class="n">время</th></tr>${Object.entries(c.per_task).map(([t,d])=>`<tr><td>${esc(t)}</td><td>${d.pass[0]?'✓':'✗'} → ${d.pass[1]?'✓':'✗'}</td><td class="n">${d.partial>0?'+':''}${d.partial}</td><td class="n">${d.cost_usd>0?'+':''}${d.cost_usd}</td><td class="n">${d.duration_s>0?'+':''}${d.duration_s} с</td></tr>`).join('')}</table></div>`:''}
      <details><summary class="stat">гипотеза и план</summary><p>${esc(c.hypothesis.rationale)}</p><pre>${esc(c.hypothesis.plan)}</pre><p class="stat">Ожидалось: ${esc(c.hypothesis.expected||'')}</p>${c.tests_tail?`<pre>${esc(c.tests_tail)}</pre>`:''}</details>
      ${c.implementation&&c.implementation.project?`<a href="#/p/${encodeURIComponent(c.implementation.project.split('/').pop())}">проект реализации →</a>`:''}</div>`).join('')}`).join('')}
    ${ev.absorb.length?`<h2>Абсорбция чужих харнессов</h2>${ev.absorb.map(a=>`<div class="pcard" style="cursor:default"><div class="top"><span class="nm">${esc(a.source)}</span><span class="badge">${esc(a.license)}</span></div><div class="stat">${esc(a.summary)}</div>
      ${a.features.map(f=>`<div><div class="bar" style="width:120px;display:inline-flex;vertical-align:middle"><i class="s-done" style="width:${(f.fit||0)*100}%"></i></div> <b>${esc(f.name)}</b> → ${esc(f.target||'')} <span class="stat">${esc((f.value||'').slice(0,200))}</span></div>`).join('')}</div>`).join('')}`:''}
    ${ev.diagnosis?`<h2>Последняя диагностика</h2><pre>${esc(ev.diagnosis)}</pre>`:''}`}).join('')};
  await draw();timer=setInterval(draw,5000)}

/* ---------- Скиллы ---------- */
async function skills(){const sk=await api('/api/skills');
  $('#view').innerHTML=`<div class="wrap"><p class="stat">Общая библиотека всех проектов. Агенты создают и правят только свои скиллы; каждая правка в журнале и откатывается.</p><div class="tablewrap"><table><tr><th>скилл</th><th>категория</th><th>источник</th><th>состояние</th><th class="n">использований</th><th>описание</th></tr>
  ${sk.map(s=>`<tr><td><a data-k="${esc(s.name)}" style="cursor:pointer">${esc(s.name)}</a>${s.pinned?' 📌':''}</td><td>${esc(s.category)}</td><td>${esc(s.origin)}</td><td>${esc(s.state)}</td><td class="n">${s.use_count}</td><td>${esc(s.description.slice(0,200))}</td></tr>`).join('')||'<tr><td colspan="6" class="stat">пусто</td></tr>'}</table></div></div>`;
  document.querySelectorAll('[data-k]').forEach(a=>a.onclick=async()=>{const r=await api(`/api/skills/${encodeURIComponent(a.dataset.k)}`);
    dlg(`<h3>${esc(a.dataset.k)}</h3><pre>${esc(r.text)}</pre><h2>История изменений</h2>${r.ledger.map(e=>`<div class="ev">${fmtDT(e.ts)} · ${esc(e.action)} · ${esc(e.actor)} · ${esc(e.reason||'')}</div>`).join('')}`)})}
/* ---------- Плагины ---------- */
const PKIND={builtin:'встроенный',config:'из artel.yaml',package:'пакет'};
function plgManifest(r,perms){return Object.entries(r.manifests||{}).map(([ep,m])=>`<div class="kv"><span>плагин</span><span><b>${esc(m.name||ep)}</b> ${esc(m.version||'')}${m.description?' — '+esc(m.description):''}</span>
   <span>provides</span><span>${(m.provides||[]).map(x=>`<span class="ft">${esc(x)}</span>`).join('')||'—'}</span>
   <span>requires</span><span>${(m.requires||[]).map(x=>`<span class="ft">${esc(x)}</span>`).join('')||'—'}</span>
   ${m.note?`<span>примечание</span><span class="stat">${esc(m.note)}</span>`:''}</div>`).join('')+
  `<div class="kv" style="margin-top:4px"><span>разрешения</span><span>${(r.permissions||[]).map(x=>`<span class="perm" title="${esc(perms[x]||'своё разрешение')}">${esc(x)}</span>`).join('')||'не просит'}</span></div>`}
async function plugins(){$('#view').innerHTML='<div class="wrap plg" id="plg"><div class="empty">Загрузка…</div></div>';
  const draw=async()=>{const o=await api('/api/plugins');const box=$('#plg');if(!box)return;const perms=o.permissions||{};state.plg=o.plugins;
   const card=r=>{const st=r.error?'<span class="st err">ошибка</span>':r.enabled?'<span class="st on">включён</span>':'<span class="st off">выключен</span>';
     const acts=r.kind==='config'?'<span class="stat">меняется в artel.yaml</span>':r.core?'<span class="stat">ядро Artel — не выключается</span>':
       `${r.enabled?`<button data-pa="disable" data-id="${esc(r.id)}">Выключить</button>`:`<button class="primary" data-pa="enable" data-id="${esc(r.id)}">Включить…</button>`}
        ${r.kind==='package'?`<button data-pa="update" data-id="${esc(r.id)}">Обновить</button><button data-pa="remove" data-id="${esc(r.id)}">Удалить</button>`:''}`;
     return `<div class="pvc"><h3>${ri(r.kind==='package'?'absorber':'worker')}${esc(r.id)}${st}</h3>
      <div class="kv"><span>тип</span><span>${PKIND[r.kind]||esc(r.kind)}${r.version?' · '+esc(r.version):''}</span>
      ${r.kind==='package'?`<span>источник</span><span><code>${esc(r.source)}</code>${r.revision?' @ '+esc(r.revision):''}</span><span>обновлён</span><span>${fmtDT(r.updated_at)}</span>`:''}</div>
      ${r.error?`<div class="errbox">${esc(r.error)}</div>`:''}
      ${plgManifest(r,perms)}<div class="acts">${acts}</div></div>`};
   const pk=o.plugins.filter(r=>r.kind==='package'),bi=o.plugins.filter(r=>r.kind!=='package');
   box.innerHTML=`<p class="stat">Каждая способность Artel — плагин с манифестом. Пакеты ставятся в ARTEL_HOME/plugins выключенными: плагин не работает, пока вы не прочтёте манифест и не включите его. Пакет из PyPI ставится только готовым колесом и папка с artel-plugin.toml копируется — их код при установке не запускается; пакет из git или папки с pyproject.toml/setup.py собирается, и его сценарий сборки выполняется уже при установке. Плагин работает внутри Artel с его правами — ставьте только то, чему доверяете. Плагин, который не загрузился, выключается с ошибкой; Artel продолжает работу.</p>
   <h2>Установить</h2><div class="inst"><input id="plg-src" placeholder="git URL (https://github.com/…), пакет pip (artel-plugin-x==1.0) или путь к папке"><button class="primary" id="plg-go">Установить</button></div>
   <p class="stat" id="plg-msg"></p>
   <h2>Пакеты</h2>${pk.length?`<div class="pv">${pk.map(card).join('')}</div>`:'<p class="stat">Пакетов нет. Пример: examples/artel-plugin-hello.</p>'}
   <h2>Встроенные</h2><div class="pv">${bi.map(card).join('')}</div>
   <h2>События жизненного цикла</h2><div class="tablewrap"><table><tr><th>событие</th><th>данные</th></tr>${Object.entries(o.events||{}).map(([k,v])=>`<tr><td><code>${esc(k)}</code></td><td>${esc(v)}</td></tr>`).join('')}</table></div>`;
   $('#plg-go').onclick=async()=>{const src=$('#plg-src').value.trim();if(!src)return;$('#plg-go').disabled=true;$('#plg-msg').textContent='Устанавливаю… (pip / git, может занять минуту)';
     const r=await post('/api/plugins/install',{source:src});$('#plg-go').disabled=false;
     if(r.error){$('#plg-msg').innerHTML=`<span style="color:var(--bad)">${esc(r.error)}</span>`;return}
     $('#plg-msg').textContent=`Установлен ${r.name} ${r.version||''} — выключен. Проверьте манифест и включите.`;await draw()};
   document.querySelectorAll('[data-pa]').forEach(b=>b.onclick=async()=>{const id=b.dataset.id,a=b.dataset.pa,r=state.plg.find(x=>x.id===id);
     if(a==='enable'){dlg(`<h3>Включить ${esc(id)}?</h3><p class="stat">Плагин запустит свой setup внутри Artel и получит его права. Проверьте, что он просит.</p>${plgManifest(r,perms)}
        <div style="margin-top:12px"><button class="primary" id="plg-yes">Включить</button></div>`);
       $('#plg-yes').onclick=async()=>{$('#plg-yes').disabled=true;const x=await post(`/api/plugins/${encodeURIComponent(id)}/enable`);dlgEl.close();
         if(x.error)alert((r.kind==='package'?'Не загрузился, оставлен выключенным: ':'')+x.error);await draw()};return}
     if(a==='remove'&&!confirm(`Удалить ${id}?`))return;
     b.disabled=true;const x=await post(`/api/plugins/${encodeURIComponent(id)}/${a}`);if(x.error)alert(x.error);await draw()})};
  await draw()}
route();

// --- self-update -----------------------------------------------------------------------------------
async function checkUpdate(force){const u=await api('/api/update'+(force?'?check=1':''));const b=$('#updbtn');
  const busy=u.state&&u.state.phase==='restart_pending';
  if(u.available||busy){b.style.display='';b.className='primary';b.textContent=busy?'Перезапуск…':`Обновление (${u.behind})`}else{b.style.display='none'}
  return u}
function updDialog(u){const st=u.state||{};const when=t=>fmtDT(t);
  const rows=(u.commits||[]).map(c=>`<tr><td class="stat">${esc(c.date.slice(0,16).replace('T',' '))}</td><td>${esc(c.subject)}</td></tr>`).join('');
  const done=(u.roadmap_done||[]).map(r=>`<li><b>${esc(r.id)}</b> — ${esc(r.title)} <span class="stat">из ${esc(r.from)}</span></li>`).join('');
  const hist=(u.history||[]).slice().reverse().map(h=>`<li class="stat">${when(h.ts)} · ${esc(h.action)} ${esc((h.from||'').slice(0,8))} → ${esc((h.to||'').slice(0,8))}</li>`).join('');
  dlg(`<h3>Обновление Artel</h3>
   <p class="stat">Канал ${esc(u.channel||'')} · установлено ${esc((u.current||'').slice(0,10))} · новое ${esc((u.remote||'').slice(0,10))}</p>
   ${u.available?`<p>Новых изменений: <b>${u.behind}</b>${u.deps_changed?' · изменились зависимости (будут установлены)':''}</p>`:`<p>${esc(u.reason||'Установлена последняя версия')}</p>`}
   ${done?`<h4>Новое из дорожной карты</h4><ul>${done}</ul>`:''}
   ${rows?`<h4>Изменения</h4><div class="tablewrap" style="max-height:280px;overflow:auto"><table>${rows}</table></div>`:''}
   ${st.phase==='error'?`<pre>${esc(st.error)}</pre>`:''}
   ${st.phase==='restart_pending'?`<p>Обновление установлено. Перезапуск ${st.waiting_for&&st.waiting_for.length?'после завершения проектов: '+esc(st.waiting_for.join(', ')):'сейчас'}.</p>`:''}
   ${u.running_projects&&u.running_projects.length&&u.available?`<p class="stat">Идут проекты (${u.running_projects.length}); перезапуск подождёт их завершения.</p>`:''}
   <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
     <button class="primary" id="upd-go" ${u.can_update?'':'disabled'}>Обновить</button>
     <button id="upd-check">Проверить сейчас</button>
     <button id="upd-back" ${(u.history||[]).some(h=>h.action==='update')?'':'disabled'}>Откатить последнее</button></div>
   <p class="stat">Перед установкой новая версия проверяется тестами опор во временной копии; при провале ничего не меняется.</p>
   ${hist?`<h4>История</h4><ul>${hist}</ul>`:''}`);
  $('#upd-go').onclick=async()=>{$('#upd-go').disabled=true;$('#upd-go').textContent='Проверка и установка…';
    const r=await api('/api/update/apply',{method:'POST',headers:{'Content-Type':'application/json'}});updDialog(await checkUpdate(false));if(!r.ok)return;waitRestart()};
  $('#upd-check').onclick=async()=>updDialog(await checkUpdate(true));
  $('#upd-back').onclick=async()=>{if(!confirm('Вернуть предыдущую версию?'))return;const r=await api('/api/update/rollback',{method:'POST',headers:{'Content-Type':'application/json'}});updDialog(await checkUpdate(false));if(r.ok)waitRestart()}}
function waitRestart(){const t0=Date.now();const iv=setInterval(async()=>{try{const u=await api('/api/update');if(u.state.phase!=='restart_pending'&&Date.now()-t0>3000){clearInterval(iv);location.reload()}}catch(e){}},2000)}
$('#updbtn').onclick=async()=>updDialog(await checkUpdate(false));
checkUpdate(false);setInterval(()=>checkUpdate(false),60000);
</script>
