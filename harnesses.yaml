# Main harnesses: significance metrics (snapshot), their signature mechanisms and whether Artel has them.
# Rendered with roadmap.yaml into docs/roadmap.html by `artel roadmap html`. Score: artel/roadmap.py significance().
snapshot: '2026-10-07'
source: 'метрики: repos.ecosyste.ms (зеркало GitHub) на дату снимка; кураторы — 10 awesome-списков в artel/data/harnesses.json'
findings:
- '<b>Опоры взяты у лидеров — да.</b> Скиллы — от Hermes Agent (2-е место из 43), души — от OpenClaw (1-е), модульность —
  от DeepSeek Harness (значимый); работа до готовности — от Prime Agent (по популярности нишевый, но первоисточник цикла целей).
  Из Codex (4-е место) взят весь контур безопасности: песочница, execpolicy, guardian.'
- '<b>Основные фишки главных coding-агентов — нет, не все.</b> Из 52 ключевых механизмов харнессов ядра в Artel есть 21 (40%),
  ещё 9 частично, 10 запланированы, 12 — пробелы. Самые заметные пробелы повторяются у нескольких лидеров сразу: файлы инструкций
  проекта (AGENTS.md / CLAUDE.md / GEMINI.md), подключение внешних MCP-серверов, субагенты по запросу, пользовательские хуки,
  запуск из CI и GitHub, веб-поиск, диагностика после правки, repo map, откат по кнопке.'
- <b>Почему так вышло.</b> Раньше очередь изучения задавала «релевантность» из реестра — оценка по ключевым словам README.
  Она поднимала нишевые надстройки над Claude Code (ECC — 29, oh-my-claudecode — 25, Hive — 27) и занижала сами главные харнессы
  (Claude Code — 8, Aider — 11, у Gemini CLI оценки не было). Поэтому волна 4 состоит из находок Fusion, Hive, ECC и oh-my-claudecode,
  а у лидеров изучены не все механизмы.
- <b>Что изменено.</b> Значимость теперь считается индексом (критерии ниже) по 43 харнессам; очередь изучения (<code>artel
  roadmap study</code>) берёт сначала главные харнессы, чей код ещё не разобран — Superpowers, Spec Kit, CrewAI, LangGraph,
  Mem0, SWE-agent, AutoGen, Aider. В план добавлено 17 пунктов с приоритетом «ядро» (волна 3) — по одному на каждый пробел
  у лидеров; ещё 4 уже запланированных пункта (plan review, двухфазная память, автоматизации, устойчивое исполнение) подняты
  в тот же приоритет. Эволюция (<code>artel evolve --roadmap</code>) берёт их первыми.
- <b>Чего брать не нужно.</b> Производные проекты (claw-code, Qwen Code, ECC, Ruflo, oh-my-claudecode, nanobot) популярны,
  но механизмов не вводят — их полезные находки уже учтены; дальше они изучаются только после первоисточников.
