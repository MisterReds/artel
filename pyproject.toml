[project]
name = "artel"
version = "0.1.0"
description = "Self-improving multi-agent harness: goal -> project -> kanban -> bots with souls -> verified result"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "httpx>=0.27", "PyYAML>=6", "tzdata; sys_platform == \"win32\""]  # tzdata: Windows has no IANA zone database

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
artel = "artel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["artel*"]

[tool.setuptools.package-data]
"artel.web" = ["index.html", "login.html", "static/*.svg", "static/*.js", "static/*.css", "static/*.webmanifest", "static/icons/*",
               "static/fonts/*"]
"artel.data" = ["harnesses.json"]
