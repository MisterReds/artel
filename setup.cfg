[mutmut]
source_paths=artel
also_copy=
    scripts/
mutate_only_covered_lines=true
only_mutate=
    artel/agent_env.py
pytest_add_cli_args=
    -p
    no:randomly
    -q
    --deselect
    tests/test_ports.py::test_import_boundaries
    --deselect
    tests/test_ports.py::test_no_vendor_names_in_packages
    --deselect
    tests/test_ports.py::test_fakes_satisfy_protocols
pytest_add_cli_args_test_selection=
    tests/test_check_programs.py
    tests/test_env_failures.py
    tests/test_provision.py
    tests/test_security.py
