# Artel roadmap — the single source of truth. docs/ROADMAP.md is generated from this file (`artel roadmap render`).
#
# status: done | partial | planned | in_progress
# mode:   pillar  — a foundation; contract guarded by tests/test_invariants.py
#         design  — structural; implemented deliberately by hand, not by evolution
#         evolve  — implemented by `artel evolve --roadmap` (branch, tests, benchmark, merge)
# source.repo + source.paths are handed to the implementing team as read-only references.

pillars:
  - id: P1-modularity
    title: Everything is a plugin — manifests, reversible effects, hot reload, swappable runtimes
    source: {harness: DeepSeek Harness, repo: deepseek-ai/deepseek-harness, paths: [docs/architecture.md]}
    status: done
    where: [artel/kernel.py, artel/plugins/]
  - id: P2-skills
    title: Self-improving skill library — create/patch after hard tasks, read-before-write, ledger, lifecycle, guard
    source: {harness: Hermes Agent, repo: NousResearch/hermes-agent, paths: [agent/background_review.py, tools/skill_manager_tool.py, tools/skill_ledger.py, agent/curator.py]}
    status: done
    where: [artel/skills.py, artel/plugins/skill_tools.py]
  - id: P3-goal-loop
    title: Work until done — continuation, no-progress backoff, evidence, reviewer and auditor decide
    source: {harness: Prime Agent, repo: PrimeIntellect-ai/prime-agent, paths: [crates/pa-core/src/goals.rs, crates/pa-core/src/autonomous/mod.rs]}
    status: done
    where: [artel/agent.py, artel/manager.py]
  - id: P4-souls
    title: Bots with souls — SOUL/IDENTITY/RULES/MEMORY and a private workspace
    source: {harness: OpenClaw, repo: openclaw/openclaw, paths: [docs/reference/templates]}
    status: done
    where: [artel/project.py]
  - id: P5-transparency
    title: Append-only event log; every model and tool call recorded; live dashboard
    source: {harness: DeepSeek Harness, repo: deepseek-ai/deepseek-harness, paths: [docs/subsystems/session.md]}
    status: done
    where: [artel/kernel.py, artel/web/]
  - id: P6-kanban
    title: Kanban DAG with compare-and-swap claims
    source: {harness: Hermes Agent, repo: NousResearch/hermes-agent, paths: [hermes_cli/kanban_db.py]}
    status: done
    where: [artel/board.py]
  - id: P7-measured-evolution
    title: Evolution through branches, tests, hidden-check benchmark, population screening and stacking
    source: {harness: auto-harness / Gear / Ouroboros, repo: neosigmaai/auto-harness, paths: [PROGRAM.md]}
    status: done
    where: [artel/evolve/]

items:
  # ---- built by hand outside the waves (product and reliability) ----
  - {id: D-self-update, wave: 0, mode: design, status: done, title: "Self-update from the dashboard and CLI, verified by the pillar tests before switching, rollback", source: {harness: Artel, repo: MisterReds/artel}, target: [artel/updater.py]}
  - {id: D-brand, wave: 0, mode: design, status: done, title: "Brand identity: A-frame mark, copper palette, bundled fonts, role icons, terminal colours", source: {harness: Artel, repo: MisterReds/artel}, target: [artel/web/, docs/BRAND.md]}
  - {id: D-codex-runtime, wave: 0, mode: design, status: done, title: "Codex runtime (ChatGPT subscription) with device-code login", source: {harness: Codex / Hermes Agent, repo: openai/codex}, target: [artel/runtimes/codex.py, artel/providers.py]}
  - {id: D-providers, wave: 0, mode: design, status: done, title: "Провайдеры page: subscriptions, keys (set/unset only), local model, per-role routing, CLIs installed on demand without Node.js", source: {harness: Artel, repo: MisterReds/artel}, target: [artel/providers.py, artel/tools.py]}
  - {id: D-installers, wave: 0, mode: design, status: done, title: "Installers for Linux/macOS and Windows that install only what Artel needs", source: {harness: Artel, repo: MisterReds/artel}, target: [install.sh, install.ps1]}
  - {id: D-failure-classes, wave: 0, mode: design, status: done, title: "No crash, no endless loop: auto executor, setup errors to a person, limits wait, replan cap", source: {harness: Artel, repo: MisterReds/artel}, target: [artel/failures.py, artel/manager.py, artel/runtimes/__init__.py]}
  - {id: D-evolution-ops, wave: 0, mode: design, status: done, title: "Evolution operations: adopt mode for roadmap items, resume after restart, pause on provider limits, journal on GitHub", source: {harness: Artel, repo: MisterReds/artel}, target: [artel/evolve/engine.py]}
  # ---- wave 1: loop reliability (cheap, directly moves pass rate and cost) ----
  - id: W1-loop-detector
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-2 (evolve/g2-1-w1-loop-detector-loop-detector-i)"
    title: Loop detector — identical tool calls in a row and repeated text stop the run with a corrective note
    source: {harness: Qwen Code, repo: QwenLM/qwen-code, paths: [packages/core/src/services/loopDetectionService.ts]}
    target: [artel/agent.py, artel/runtimes/claude_code.py]
    plan: >-
      Track (tool name, canonical JSON args) per run; on the 5th identical consecutive call inject a system note and,
      if it repeats, end the run as stalled with reason "loop". Detect repeated 50-char chunks in assistant text
      (>=10 repeats). Log agent/loop events. Unit tests for both detectors.
    acceptance: [unit tests for tool-call and text loops, no benchmark regression]
  - id: W1-evidence-window
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-2 (evolve/g2-2-w1-evidence-window-evidence-wind)"
    title: Evidence window keeps head and tail, cuts the middle
    source: {harness: Qwen Code, repo: QwenLM/qwen-code, paths: [packages/core/src/goals/goal-evidence.ts]}
    target: [artel/manager.py, artel/plugins/builtin_tools.py]
    plan: >-
      Replace tail truncation of evidence, gate output and run summaries with a head+tail window (tail gets the
      larger share, marker in the middle), so summary lines like "412 passed" survive.
    acceptance: [unit test that a long pytest output keeps its final summary line]
  - id: W1-output-spill
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-3 (evolve/g3-1-w1-output-spill-oversized-tool-o)"
    title: Oversized tool output spills to a file with a preview and the path
    source: {harness: OpenCode, repo: anomalyco/opencode, paths: [packages/opencode/src/tool/truncate.ts]}
    target: [artel/plugins/builtin_tools.py]
    plan: Over 2000 lines or 50 KB, write the full output under the run workspace and return head/tail preview plus the path.
    acceptance: [unit test for spill and preview]
  - id: W1-read-cache
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-2 (evolve/g2-4-w1-read-cache-stale-edit-guard-r)"
    title: Stale-edit guard — refuse edits to files changed since the agent last read them
    source: {harness: Qwen Code, repo: QwenLM/qwen-code, paths: [packages/core/src/services/fileReadCache.ts]}
    target: [artel/plugins/builtin_tools.py, artel/tooling.py]
    plan: Record (mtime, size) on read_file/write_file in ToolContext; edit_file refuses if the file changed since, asking to re-read.
    acceptance: [unit test for the stale edit refusal]
  - id: W1-fuzzy-edit
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-3 (evolve/g3-2-w1-fuzzy-edit-fuzzy-edit-applica)"
    title: Fuzzy edit application (whitespace-normalized, then block-anchor match)
    source: {harness: OpenCode, repo: anomalyco/opencode, paths: [packages/opencode/src/tool/edit.ts]}
    target: [artel/plugins/builtin_tools.py]
    plan: When exact match fails, try line-trimmed match, then first/last-line anchors with Levenshtein similarity; refuse ambiguous matches.
    acceptance: [unit tests for each fallback and ambiguity refusal]
  - id: W1-post-write-diagnostics
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-3 (evolve/g3-3-w1-post-write-diagnostics-diagno)"
    title: Diagnostics right after a write (py_compile / configured linters)
    source: {harness: OpenCode, repo: anomalyco/opencode, paths: [packages/opencode/src/tool/write.ts, packages/opencode/src/lsp/]}
    target: [artel/plugins/builtin_tools.py]
    plan: After write_file/edit_file on .py run py_compile (and ruff if present); append errors to the tool result.
    acceptance: [unit test that a syntax error is reported in the same tool result]
  - id: W1-compaction
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-3 (evolve/g3-4-w1-compaction-context-compaction)"
    title: Context compaction for the native runtime — clear old tool outputs, then summarize
    source: {harness: Claude Code / OpenCode, repo: anomalyco/opencode, paths: [packages/opencode/src/session/compaction.ts]}
    target: [artel/agent.py]
    plan: Over a token threshold, replace tool_result contents older than two turns with placeholders; above a second threshold, summarize the head into one message.
    acceptance: [unit test with a long synthetic conversation, no benchmark regression]
  - id: W1-snapshots
    wave: 1
    mode: evolve
    status: done
    result: "evolve/gen-3 (evolve/g3-5-w1-snapshots-shadow-git-snapshot)"
    title: Shadow-git snapshot per run; rejected attempt can be reverted
    source: {harness: OpenCode, repo: anomalyco/opencode, paths: [packages/opencode/src/snapshot/index.ts, packages/opencode/src/session/revert.ts]}
    target: [artel/manager.py]
    plan: Snapshot the deliverables directory before each run in a separate git dir; on rejection with "start over" guidance, restore it.
    acceptance: [unit test snapshot + restore]

  # ---- wave 2: isolation and safety ----
  - id: W2-worktree-isolation
    wave: 2
    mode: design
    status: planned
    title: Worker isolation — git worktree (or container) per task, merge on acceptance
    source: {harness: Archon / Gas Town / Qwen Code, repo: QwenLM/qwen-code, paths: [packages/core/src/services/gitWorktreeService.ts]}
    target: [artel/manager.py, artel/project.py]
  - id: W2-execpolicy
    wave: 2
    mode: evolve
    status: done
    result: "evolve/gen-4 (merged by hand after a conflict with the System One change)"
    title: Command policy rules allow/prompt/forbidden with match/not_match examples validated at load
    source: {harness: Codex, repo: openai/codex, paths: [codex-rs/execpolicy/README.md]}
    target: [artel/plugins/builtin_tools.py]
    plan: >-
      Rules file (ARTEL_HOME/policy.yaml + project override): each rule has a command prefix or regex, a decision
      allow | prompt | forbidden, a justification, and match / not_match examples that are checked when the policy loads
      (a rule whose examples fail is an error). bash and the Codex / Claude Code runtimes consult it before running a
      command: forbidden -> tool error with the justification; prompt -> the task goes to a person (needs_human) with the
      command; allow -> run. Ship safe defaults (rm -rf /, curl | sh, git push --force on main, credential files).
    acceptance: [policy examples validated at load (bad example = load error), forbidden command never executes (test), prompt sends the task to a person with the command, no benchmark regression]
  - id: W2-guardian
    wave: 2
    mode: evolve
    status: planned
    result: "gen 4: conflicted in artel/plugins/builtin_tools.py with the adopted items; retried on the new main"
    title: Asynchronous trajectory risk reviewer; high risk switches later actions to blocking review
    source: {harness: Codex, repo: openai/codex, paths: [codex-rs/prompts/templates/guardian/classifier_instructions.md]}
    target: [artel/manager.py]
    plan: >-
      After each worker run, a cheap reviewer (System One or a small model) scores the trajectory's risk from the
      event log: destructive commands, writes outside the workspace, network exfiltration, secrets in output. Low risk:
      nothing. High risk: the task's later runs require a blocking review of every shell command by the guardian before
      execution, and the dashboard shows a risk badge with the reason.
    acceptance: [risk score logged for every run (guardian/assessed events), high-risk run switches the task to blocking review, a scripted destructive trajectory is flagged high, cost increase <= 5%]
  - id: W2-sandbox
    wave: 2
    mode: design
    status: planned
    title: bubblewrap sandbox for worker bash
    source: {harness: Codex, repo: openai/codex, paths: [codex-rs/linux-sandbox/README.md]}
    target: [artel/plugins/builtin_tools.py]
  - id: W2-fs-grants
    wave: 2
    mode: evolve
    status: planned
    result: "gen 4: conflicted in artel/plugins/builtin_tools.py with the adopted items; retried on the new main"
    title: Explicit read/write grants per path
    source: {harness: OpenScience, repo: synthetic-sciences/openscience, paths: [ARCHITECTURE.md]}
    target: [artel/tooling.py]
    plan: >-
      Per-role and per-project grants: read paths, write paths (default: workspace + shared deliverables; read-only
      refs). ToolContext.resolve enforces them for every file tool; the Codex runtime maps them to --add-dir / sandbox,
      Claude Code to --add-dir and disallowed write tools. A denied access returns a tool error naming the grant.
    acceptance: [writes outside granted paths are refused for every runtime (tests), refs stay read-only, grants visible on the project page, no benchmark regression]

  - id: W2-cost-down
    wave: 2
    mode: evolve
    status: done
    result: "evolve/gen-4 (merged by hand after a conflict with the System One change)"
    title: Bring cost back down — wave 1 raised the benchmark cost from $4.57 to $5.99 (+31%)
    source: {harness: Claude Code / Codex, repo: anthropics/claude-code, paths: [README.md]}
    target: [artel/agent.py, artel/prompts.py, artel/manager.py, artel/runtimes/claude_code.py]
    plan: >-
      Find where the tokens go (per role, per tool output) with the analytics already logged; then: prompt caching
      for the native runtime's stable system prefix, trimming repeated context given to reviewer / auditor, cheaper
      model or lower effort for librarian / refiner / auditor where pass rate holds, skipping roles that add
      nothing on easy tasks. Each change measured separately.
    acceptance: [benchmark cost <= $5.0 with 7/7 passing, no role quality drop on hidden checks]
  - id: W2-ci
    wave: 2
    mode: design
    status: planned
    title: CI on Linux, macOS and Windows — tests, installer and a scripted first run on every push
    source: {harness: OpenHands / Codex, repo: openai/codex, paths: [.github/workflows]}
    target: [.github/workflows]
    plan: >-
      GitHub Actions matrix (ubuntu, macos, windows): full test suite; install.sh / install.ps1 into a clean home with
      the local checkout as the repo; `artel run --provider scripted` end to end; dashboard starts and answers
      /api/ready. Required before an evolution merge is published.
    acceptance: [green on all three systems, installer failures block the merge]
  - id: W2-remote-and-notify
    wave: 2
    mode: design
    status: planned
    title: Use from the phone — authenticated remote dashboard and notifications (Telegram / webhook)
    source: {harness: Hermes Agent / OpenClaw, repo: NousResearch/hermes-agent, paths: [gateway/]}
    target: [artel/web/server.py]
    plan: >-
      Optional remote mode: the dashboard binds beyond localhost only with a login token (generated, shown once,
      stored hashed) and HTTPS via a reverse proxy recipe. Notifications on waiting_human, done, update available:
      Telegram bot or a generic webhook, configured on the Провайдеры page; tokens only from the environment.
    acceptance: [remote access refused without the token, notifications delivered in a test double, no secrets stored in plain text]
  - id: W2-timezone
    wave: 2
    mode: evolve
    status: done
    result: "evolve/gen-4 (merged by hand after a conflict with the System One change)"
    title: User time zone for every time shown (dashboard, CLI, notifications), e.g. Asia/Sakhalin
    source: {harness: Artel, repo: MisterReds/artel, paths: [artel/web/index.html]}
    target: [artel/web/index.html, artel/cli.py]
    plan: >-
      Setting ui.timezone (IANA name, default: the browser's / system zone) editable on the Провайдеры page; all
      timestamps in the dashboard, CLI output and notifications rendered in it.
    acceptance: [times rendered in the configured zone (test with Asia/Sakhalin), invalid zone rejected]
  - id: W2-evolve-two-subscriptions
    wave: 2
    mode: design
    status: planned
    title: Evolution across two subscriptions (Claude Code and Codex) so one provider's limit does not stop it
    source: {harness: Artel, repo: MisterReds/artel, paths: [artel/evolve/engine.py]}
    target: [artel/evolve/engine.py]
    plan: >-
      Implementation and benchmark can each run on Claude Code or Codex; when one provider pauses on a limit, the
      generation continues the remaining work on the other. Baselines are per runtime so comparisons stay fair.
    acceptance: [a limit on one provider moves work to the other (test), baselines keyed by runtime]

  # ---- wave 3: architecture and scale ----
  - id: W3-acp-runtime
    wave: 3
    mode: design
    status: planned
    title: ACP runtime plugin — any ACP agent (Claude Code, Codex, Gemini, OpenHands) as a worker
    source: {harness: OpenHands, repo: OpenHands/OpenHands, paths: [docs/ACP_AGENTS.md]}
    target: [artel/plugins/runtimes.py]
  - id: W3-dsh-runtime
    wave: 3
    mode: design
    status: planned
    title: DeepSeek Harness as a runtime plugin, so dsh plugins work inside Artel workers
    source: {harness: DeepSeek Harness, repo: deepseek-ai/deepseek-harness, paths: [docs/user/guide/python-sdk.md]}
    target: [artel/plugins/runtimes.py]
  - id: W3-durable
    wave: 3
    mode: design
    status: planned
    title: Durable turns and idempotent run receipts — resume mid-turn after a crash
    source: {harness: Pi / OpenScience, repo: badlogic/pi-mono, paths: [packages/durable/README.md]}
    target: [artel/agent.py, artel/board.py]
  - id: W3-plugin-packages
    wave: 3
    mode: design
    status: done
    result: "feat/plugin-packages: artel plugins install|list|show|enable|disable|update|remove (git, pip, path; ARTEL_HOME/plugins + plugins.json; static manifest, installed disabled), lifecycle events project_start / before_agent_start / agent_end / task_done / project_end / session_shutdown, failing plugins disabled with the error, dashboard section, examples/artel-plugin-hello"
    title: Plugin packages (install from git/pip), lifecycle events before_agent_start / session_shutdown
    source: {harness: Pi, repo: badlogic/pi-mono, paths: [packages/coding-agent/docs/extensions.md, packages/coding-agent/docs/packages.md]}
    target: [artel/kernel.py, artel/packages.py, artel/manager.py, artel/runtimes/__init__.py, artel/web/]
  - id: W3-state-machine
    wave: 3
    mode: evolve
    status: planned
    title: Task as a state machine with executable transition gates
    source: {harness: StateM, repo: henryqin1997/statem, paths: [README.md]}
    target: [artel/manager.py]
    plan: >-
      Describe the task lifecycle (todo -> ready -> running -> review -> done / blocked) as a declarative table with an
      executable gate per transition (e.g. running -> review requires evidence; review -> done requires a reviewer
      verdict and green gates). The manager applies transitions only through the table; invalid transitions raise.
    acceptance: [every board move goes through the table (test over a full run), pillar invariants still pass, no benchmark regression]
  - id: W3-fresh-context-steps
    wave: 3
    mode: evolve
    status: planned
    title: Fresh context per step, verified state outside the context
    source: {harness: LongHorizon-Harness, repo: AMAP-ML/LongHorizon-Harness, paths: [README.md]}
    target: [artel/manager.py]
    plan: >-
      For long tasks, split execution into steps; each step starts a fresh agent context fed only with the verified
      state (files, test results, a short progress file), not the previous transcript. The progress file is written by
      the agent and checked by the manager.
    acceptance: [tasks over N turns run in steps with a progress file, pass rate on long tasks does not drop, tokens per long task drop]
  - id: W3-plan-review
    wave: 3
    mode: evolve
    status: planned
    title: Plan review before execution; built-in Explore / Plan / Verification subagents
    source: {harness: Fusion / Claude Code, repo: lintsinghua/claude-code-book, paths: [en/Part-3-Advanced-Patterns/09-Sub-Agents-and-the-Fork-Pattern.md]}
    target: [artel/manager.py]
    plan: >-
      Before execution, a reviewer checks the plan: missing tasks, untestable criteria, wrong dependencies, oversized
      tasks. The planner revises once. Built-in subagent roles Explore (read-only search) and Verify (runs the checks)
      are available to workers as tools.
    acceptance: [plan review events for every project, fewer audit rounds and replans on the benchmark, no cost increase over 10%]
  - id: W3-two-phase-memory
    wave: 3
    mode: evolve
    status: planned
    title: Two-phase memory — per-run extraction with secret redaction, then consolidation
    source: {harness: Codex, repo: openai/codex, paths: [codex-rs/memories/README.md]}
    target: [artel/manager.py]
    plan: >-
      Phase 1 after each run: extract durable facts (decisions, gotchas, commands that worked) with secrets redacted.
      Phase 2 periodically: consolidate into the worker's MEMORY.md and the project notes, dropping duplicates and stale
      facts. Memory is shown on the worker card.
    acceptance: [no secret patterns ever reach MEMORY.md (test), memory stays under a size cap, no benchmark regression]
  - id: W3-tree-budget
    wave: 3
    mode: evolve
    status: planned
    title: Budget for the whole agent tree with threshold reminders
    source: {harness: Codex, repo: openai/codex, paths: [codex-rs/core/src/rollout_budget.rs]}
    target: [artel/agent.py]
    plan: >-
      One budget for a project's whole agent tree (tokens and USD-equivalent): workers, reviewers, auditors, manager.
      Reminders to the running agents at 50 / 80 / 95 %; at 100 % the project pauses (paused_budget) with a clear note.
    acceptance: [budget events at thresholds, project pauses at 100 % and resumes with a raised budget, no benchmark regression]
  - id: W3-mailbox
    wave: 3
    mode: evolve
    status: planned
    title: Agent mailbox and teams
    source: {harness: Claude Code / Gas Town, repo: lintsinghua/claude-code-book, paths: [en/Part-3-Advanced-Patterns/10-The-Coordinator-Pattern-Multi-Agent-Orchestration.md]}
    target: [artel/plugins/board_tools.py]
    plan: >-
      Workers can message each other through the board (mailbox per worker): ask a teammate a question, hand over a
      finding. Messages are events, visible in the feed; a worker reads its mailbox at the start of each run.
    acceptance: [messages delivered and logged, a two-worker scripted scenario uses the mailbox, no benchmark regression]
  - id: W3-automations
    wave: 3
    mode: evolve
    status: planned
    title: Automations — schedule and event triggers
    source: {harness: OpenHands / Qwen Code, repo: QwenLM/qwen-code, paths: [packages/core/src/services/cronScheduler.ts]}
    target: [artel/web/server.py]
    plan: >-
      Schedules and event triggers for goals: run a goal every day at a time (in the user's time zone), or when a
      project finishes, or on a webhook. Managed on a dashboard page; each firing creates a normal project.
    acceptance: [cron and event triggers create projects (tests), time zone respected, triggers listed and editable in the dashboard]
  - id: W3-system-one
    wave: 3
    mode: design
    status: planned
    title: Our own System One from the partner team, connected through the System One contract (docs/SYSTEM_ONE.md)
    source: {harness: partner team, repo: pending, paths: [docs/SYSTEM_ONE.md]}
    target: [artel/decide.py]
    plan: >-
      The Jev model and the local llama.cpp runner were removed; Artel keeps the typed decision contract and four
      decision points. When the partner repository is ready: connect it (plugin or HTTP), turn the points on one at a
      time and keep only those that lower cost without lowering the pass rate on the benchmark.
    acceptance: [each enabled point measured with and without System One, decision latency under 500 ms]
