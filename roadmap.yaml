    title: Automations — schedule and event triggers
    source: {harness: OpenHands / Qwen Code, repo: QwenLM/qwen-code, paths: [packages/core/src/services/cronScheduler.ts]}
    target: [artel/web/server.py]
  - id: W3-fast-system-one
    wave: 3
    mode: design
    status: partial
    title: Fast local System One decisions (Jev-Style kept loaded in memory)
    source: {harness: Jev-Style v3, repo: chaoliangUNSW/Jev-Style-2B-Decision-v3-GGUF, paths: [jev_style_decision_gguf.py]}
    target: [artel/decide.py]
